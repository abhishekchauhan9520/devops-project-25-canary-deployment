apiVersion: apps/v1
kind: Deployment
metadata:
  name: stable
  labels:
    app: canary-demo
    track: stable
spec:
  replicas: 3
  selector:
    matchLabels:
      app: canary-demo
      track: stable
  template:
    metadata:
      labels:
        app: canary-demo
        track: stable
    spec:
      containers:
        - name: app
          image: ghcr.io/example/canary-demo:stable
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: stable
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: stable
spec:
  selector:
    app: canary-demo
    track: stable
  ports:
    - port: 80
      targetPort: 8080
